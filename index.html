    <script>
      /* Set the setting before first paint — no flash of the wrong paper. */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("atomic-models-theme");
        } catch (e) {}
        var light =
          stored === "light" ||
          (stored !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
